name: Checks

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      upload_pages_artifact:
        description: Upload the verified production build for the deployment job.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Review public file candidates
        run: npm run audit:files
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Build production assets
        run: npm run build
      - name: Upload verified Pages build
        if: ${{ inputs.upload_pages_artifact }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          retention-days: 1
