name: Deploy GitHub Pages

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  checks:
    name: Verify production source
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
    with:
      upload_pages_artifact: true

  deploy:
    name: Deploy verified build
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
